<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cjenik | DentArt Studio Zagreb</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        :root{
            --dark:#080c12;
            --dark2:#0d1520;
            --cream:#f8f4ee;
            --white:#ffffff;
            --gold:#c8a56a;
            --gold-l:#e8c99e;
            --gold-d:#9d7d42;
            --navy:#0d1520;
            --text:#e8e4de;
            --muted:#8a8680;
            --teal:#5ac8c0;
            --pad:clamp(60px,10vw,120px);
        }
        html{scroll-behavior:smooth}
        body{font-family:'Inter',sans-serif;background:var(--dark);color:var(--text);overflow-x:hidden;line-height:1.6}
        ::-webkit-scrollbar{width:5px}
        ::-webkit-scrollbar-track{background:var(--dark)}
        ::-webkit-scrollbar-thumb{background:var(--gold);border-radius:3px}
        h1,h2,h3,h4{font-family:'Cormorant Garamond',serif;font-weight:400;line-height:1.05}
        .container{max-width:1200px;margin:0 auto;padding:0 clamp(20px,5vw,60px)}
        .section{padding:var(--pad) 0}
        .gold-text{background:linear-gradient(135deg,var(--gold-l),var(--gold),var(--gold-d));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

        /* BUTTONS */
        .btn{display:inline-flex;align-items:center;gap:10px;font-family:'Inter',sans-serif;font-weight:600;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;padding:16px 36px;border:none;cursor:pointer;transition:all .3s;text-decoration:none;position:relative;overflow:hidden}
        .btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold-d));color:var(--dark)}
        .btn-gold::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);transition:left .5s}
        .btn-gold:hover::before{left:100%}
        .btn-gold:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(200,165,106,.35)}
        .btn-outline{background:transparent;color:var(--text);border:1px solid rgba(200,165,106,.4)}
        .btn-outline:hover{border-color:var(--gold);color:var(--gold);transform:translateY(-2px)}
        .btn-sm{padding:11px 24px;font-size:.72rem}

        /* LABEL */
        .lbl{display:flex;align-items:center;gap:12px;margin-bottom:16px}
        .lbl span{font-size:.7rem;font-weight:600;letter-spacing:.25em;text-transform:uppercase;color:var(--gold)}
        .lbl::after{content:'';flex:0 0 40px;height:1px;background:var(--gold)}

        /* NAV */
        .nav{position:fixed;top:0;left:0;right:0;z-index:1000;padding:22px 0;transition:all .4s}
        .nav.s{background:rgba(8,12,18,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(200,165,106,.1);padding:14px 0}
        .nav-inner{display:flex;align-items:center;justify-content:space-between}
        .logo{text-decoration:none;line-height:1}
        .logo-m{font-family:'Cormorant Garamond',serif;font-size:1.9rem;font-weight:600;color:#fff;letter-spacing:.05em;display:block}
        .logo-s{font-size:.58rem;letter-spacing:.35em;text-transform:uppercase;color:var(--gold);display:block}
        .nav-links{display:flex;align-items:center;gap:32px;list-style:none}
        .nav-links a{color:var(--text);text-decoration:none;font-size:.75rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;transition:color .3s;position:relative}
        .nav-links a::after{content:'';position:absolute;bottom:-4px;left:0;width:0;height:1px;background:var(--gold);transition:width .3s}
        .nav-links a:hover,.nav-links a.active{color:var(--gold)}
        .nav-links a:hover::after,.nav-links a.active::after{width:100%}
        .ham{display:none;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:6px}
        .ham span{display:block;width:24px;height:1.5px;background:var(--text);transition:all .3s}
        .mob-nav{position:fixed;inset:0;background:var(--dark);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px;opacity:0;pointer-events:none;transition:opacity .35s}
        .mob-nav.open{opacity:1;pointer-events:all}
        .mob-nav a{font-family:'Cormorant Garamond',serif;font-size:2.6rem;color:var(--text);text-decoration:none;transition:color .3s}
        .mob-nav a:hover{color:var(--gold)}
        .mob-close{position:absolute;top:24px;right:28px;background:none;border:none;color:#fff;font-size:2.2rem;cursor:pointer;line-height:1}

        /* PAGE HERO */
        .page-hero{position:relative;padding:160px 0 100px;overflow:hidden;background:var(--dark)}
        #hero-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
        .page-hero-grad{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,12,18,.4) 0%,transparent 40%,var(--dark) 100%),linear-gradient(90deg,var(--dark) 0%,transparent 60%)}
        .page-hero-c{position:relative;z-index:2}
        .page-hero-eyebrow{display:flex;align-items:center;gap:12px;margin-bottom:20px}
        .back-link{display:inline-flex;align-items:center;gap:6px;color:var(--gold);text-decoration:none;font-size:.72rem;letter-spacing:.15em;text-transform:uppercase;transition:gap .3s}
        .back-link:hover{gap:10px}
        .page-hero h1{font-size:clamp(3rem,7vw,6.5rem);font-weight:300;color:#fff;line-height:.95;margin-bottom:20px}
        .page-hero-sub{color:var(--muted);font-size:clamp(.9rem,1.6vw,1.1rem);max-width:520px;line-height:1.85;font-weight:300}
        .page-hero-note{display:inline-flex;align-items:center;gap:8px;margin-top:28px;padding:10px 20px;border:1px solid rgba(200,165,106,.2);background:rgba(200,165,106,.05)}
        .page-hero-note span{font-size:.72rem;color:var(--muted);letter-spacing:.05em}
        .page-hero-note strong{color:var(--gold);font-size:.72rem;font-weight:600}

        /* TABS */
        .tabs-wrap{position:sticky;top:68px;z-index:100;background:rgba(8,12,18,.96);backdrop-filter:blur(16px);border-bottom:1px solid rgba(200,165,106,.08);padding:0}
        .tabs{display:flex;overflow-x:auto;scrollbar-width:none;max-width:1200px;margin:0 auto;padding:0 clamp(20px,5vw,60px)}
        .tabs::-webkit-scrollbar{display:none}
        .tab{flex-shrink:0;padding:18px 28px;font-size:.72rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;transition:all .3s;white-space:nowrap}
        .tab:hover{color:var(--text)}
        .tab.active{color:var(--gold);border-bottom-color:var(--gold)}

        /* PRICE TABLE SECTION */
        .price-section{padding:80px 0;border-bottom:1px solid rgba(200,165,106,.06)}
        .price-section:last-child{border-bottom:none}
        .ps-header{display:grid;grid-template-columns:1fr auto;align-items:end;gap:24px;margin-bottom:40px}
        .ps-title{font-size:clamp(1.8rem,3vw,2.8rem);color:#fff}
        .ps-sub{color:var(--muted);font-size:.82rem;margin-top:8px;line-height:1.7}
        .ps-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border:1px solid rgba(200,165,106,.25);font-size:.65rem;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--gold);white-space:nowrap}

        /* PRICE ROWS */
        .price-table{width:100%;border-collapse:collapse}
        .price-table thead tr{border-bottom:1px solid rgba(200,165,106,.15)}
        .price-table thead th{padding:12px 20px;font-size:.65rem;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);text-align:left}
        .price-table thead th:last-child{text-align:right}
        .price-row{border-bottom:1px solid rgba(255,255,255,.04);transition:background .3s;cursor:default}
        .price-row:hover{background:rgba(200,165,106,.03)}
        .price-row td{padding:18px 20px;vertical-align:middle}
        .pr-name{font-family:'Cormorant Garamond',serif;font-size:1.15rem;color:var(--text)}
        .pr-desc{font-size:.75rem;color:var(--muted);margin-top:3px;line-height:1.5}
        .pr-tag{display:inline-block;padding:2px 8px;font-size:.58rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-left:8px;vertical-align:middle}
        .pr-tag.popular{background:rgba(200,165,106,.15);color:var(--gold);border:1px solid rgba(200,165,106,.3)}
        .pr-tag.new{background:rgba(90,200,192,.12);color:var(--teal);border:1px solid rgba(90,200,192,.25)}
        .pr-duration{font-size:.75rem;color:var(--muted);white-space:nowrap}
        .pr-price{text-align:right;white-space:nowrap}
        .pr-price-val{font-family:'Cormorant Garamond',serif;font-size:1.4rem;color:var(--gold);font-weight:400}
        .pr-price-from{font-size:.65rem;color:var(--muted);display:block;margin-bottom:2px;letter-spacing:.05em}
        .pr-price-note{font-size:.65rem;color:var(--muted);display:block;margin-top:2px}

        /* PACKAGE CARDS */
        .pkg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:60px}
        .pkg-card{border:1px solid rgba(200,165,106,.1);padding:44px 36px;position:relative;transition:all .45s;overflow:hidden}
        .pkg-card::before{content:'';position:absolute;bottom:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);transform:scaleX(0);transition:transform .45s}
        .pkg-card:hover{border-color:rgba(200,165,106,.3);transform:translateY(-6px)}
        .pkg-card:hover::before{transform:scaleX(1)}
        .pkg-card.feat{border-color:var(--gold);background:rgba(200,165,106,.04)}
        .pkg-badge{position:absolute;top:-1px;left:50%;transform:translateX(-50%);background:var(--gold);color:var(--dark);font-size:.6rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;padding:4px 18px;white-space:nowrap}
        .pkg-icon{font-size:1.8rem;margin-bottom:20px}
        .pkg-name{font-size:.7rem;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:10px}
        .pkg-title{font-size:1.6rem;color:#fff;margin-bottom:16px}
        .pkg-price{font-family:'Cormorant Garamond',serif;font-size:3rem;color:var(--gold);font-weight:300;line-height:1}
        .pkg-period{font-size:.75rem;color:var(--muted);margin-bottom:24px;margin-top:4px}
        .pkg-divider{width:36px;height:1px;background:linear-gradient(90deg,var(--gold),transparent);margin:20px 0}
        .pkg-features{list-style:none;display:flex;flex-direction:column;gap:11px;margin-bottom:32px}
        .pkg-features li{display:flex;align-items:flex-start;gap:10px;font-size:.82rem;color:var(--muted)}
        .pkg-features li::before{content:'✓';color:var(--gold);font-weight:700;flex-shrink:0;margin-top:1px}

        /* COMPARISON TABLE */
        .compare-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:16px}
        .compare-table{width:100%;min-width:700px;border-collapse:collapse}
        .compare-table th{padding:16px 20px;font-size:.65rem;font-weight:600;letter-spacing:.18em;text-transform:uppercase;border-bottom:1px solid rgba(200,165,106,.15)}
        .compare-table th:first-child{text-align:left;color:var(--muted)}
        .compare-table th:not(:first-child){text-align:center;color:var(--gold)}
        .compare-table th.feat-col{background:rgba(200,165,106,.06);border:1px solid rgba(200,165,106,.15);border-bottom-color:var(--gold)}
        .compare-table td{padding:14px 20px;border-bottom:1px solid rgba(255,255,255,.04);font-size:.85rem}
        .compare-table td:first-child{color:var(--text)}
        .compare-table td:not(:first-child){text-align:center;color:var(--muted)}
        .compare-table td.feat-col{background:rgba(200,165,106,.03);border-left:1px solid rgba(200,165,106,.1);border-right:1px solid rgba(200,165,106,.1)}
        .compare-table tr:hover td{background:rgba(255,255,255,.02)}
        .chk{color:var(--gold);font-size:1rem}
        .cross{color:rgba(255,255,255,.15);font-size:.9rem}
        .compare-table td span.val{color:var(--gold);font-family:'Cormorant Garamond',serif;font-size:1.1rem}

        /* FAQ */
        .faq-list{display:flex;flex-direction:column;gap:0}
        .faq-item{border-bottom:1px solid rgba(200,165,106,.08);overflow:hidden}
        .faq-q{width:100%;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:22px 0;background:none;border:none;cursor:pointer;text-align:left;transition:color .3s}
        .faq-q:hover .fq-text{color:var(--gold)}
        .fq-text{font-family:'Cormorant Garamond',serif;font-size:1.2rem;color:var(--text);transition:color .3s}
        .fq-icon{width:28px;height:28px;border:1px solid rgba(200,165,106,.3);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .3s;color:var(--gold);font-size:.9rem}
        .faq-item.open .fq-icon{background:var(--gold);color:var(--dark);border-color:var(--gold);transform:rotate(45deg)}
        .faq-a{max-height:0;overflow:hidden;transition:max-height .45s ease,padding .35s ease}
        .faq-item.open .faq-a{max-height:300px}
        .faq-a p{color:var(--muted);font-size:.88rem;line-height:1.85;padding-bottom:22px}

        /* CTA STRIP */
        .cta-strip{background:linear-gradient(135deg,var(--gold-d),var(--gold));padding:80px 0;text-align:center}
        .cta-strip h2{font-family:'Cormorant Garamond',serif;font-size:clamp(2rem,4vw,3.2rem);color:var(--dark);margin-bottom:8px}
        .cta-strip p{color:rgba(8,12,18,.6);font-size:.9rem;margin-bottom:32px}
        .btn-dark{background:var(--dark);color:var(--gold) !important;border:none}
        .btn-dark:hover{background:var(--dark2);transform:translateY(-2px);box-shadow:0 12px 32px rgba(0,0,0,.3)}

        /* FOOTER */
        .ftr{background:var(--dark);padding:60px 0 28px;border-top:1px solid rgba(200,165,106,.06)}
        .ftr-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:52px;margin-bottom:48px}
        .ftr-brand p{color:var(--muted);font-size:.82rem;line-height:1.85;margin-top:18px;max-width:260px}
        .ftr-col h4{font-size:.68rem;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:22px}
        .ftr-col ul{list-style:none;display:flex;flex-direction:column;gap:11px}
        .ftr-col ul a{color:var(--muted);text-decoration:none;font-size:.82rem;transition:color .3s}
        .ftr-col ul a:hover{color:var(--gold)}
        .ftr-bot{border-top:1px solid rgba(255,255,255,.05);padding-top:24px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px}
        .ftr-bot p{color:var(--muted);font-size:.75rem}
        .ftr-soc{display:flex;gap:12px}
        .ftr-si{width:34px;height:34px;border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;color:var(--muted);text-decoration:none;font-size:.72rem;transition:all .3s;font-weight:600}
        .ftr-si:hover{border-color:var(--gold);color:var(--gold)}

        /* FADE */
        .fu{opacity:0;transform:translateY(32px);transition:opacity .7s ease,transform .7s ease}
        .fu.vis{opacity:1;transform:translateY(0)}
        .fu-l{opacity:0;transform:translateX(-30px);transition:opacity .7s ease,transform .7s ease}
        .fu-l.vis{opacity:1;transform:translateX(0)}
        .fu-r{opacity:0;transform:translateX(30px);transition:opacity .7s ease,transform .7s ease}
        .fu-r.vis{opacity:1;transform:translateX(0)}

        /* FLOAT CTA */
        .float-cta{position:fixed;bottom:30px;right:30px;z-index:500;opacity:0;transform:translateY(20px);transition:all .4s;pointer-events:none}
        .float-cta.show{opacity:1;transform:translateY(0);pointer-events:all}
        .float-cta a{display:flex;align-items:center;gap:8px;background:var(--gold);color:var(--dark);font-family:'Inter',sans-serif;font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:14px 22px;text-decoration:none;box-shadow:0 8px 28px rgba(200,165,106,.4);transition:all .3s}
        .float-cta a:hover{transform:translateY(-3px);box-shadow:0 14px 36px rgba(200,165,106,.5)}

        /* RESPONSIVE */
        @media(max-width:1024px){
            .pkg-grid{grid-template-columns:1fr 1fr}
            .pkg-card:last-child{grid-column:span 2;max-width:60%;justify-self:center;width:100%}
            .ftr-grid{grid-template-columns:1fr 1fr}
            .ps-header{grid-template-columns:1fr}
        }
        @media(max-width:768px){
            .nav-links{display:none}
            .ham{display:flex}
            .pkg-grid{grid-template-columns:1fr}
            .pkg-card:last-child{grid-column:auto;max-width:100%}
            .price-table thead th:nth-child(2){display:none}
            .price-table td:nth-child(2){display:none}
            .ftr-grid{grid-template-columns:1fr 1fr}
        }
        @media(max-width:480px){
            .ftr-grid{grid-template-columns:1fr}
            .tabs{gap:0}
            .tab{padding:14px 18px;font-size:.65rem}
        }
    </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ── FADE OBSERVER ── */
function FU({ children, delay = 0, dir = 'up', style = {} }) {
    const ref = useRef(null);
    const [vis, setVis] = useState(false);
    useEffect(() => {
        const obs = new IntersectionObserver(([e]) => {
            if (e.isIntersecting) { setVis(true); obs.disconnect(); }
        }, { threshold: 0.08 });
        if (ref.current) obs.observe(ref.current);
        return () => obs.disconnect();
    }, []);
    const cls = dir === 'left' ? 'fu-l' : dir === 'right' ? 'fu-r' : 'fu';
    return (
        <div ref={ref} className={`${cls}${vis?' vis':''}`} style={{ transitionDelay:`${delay}s`, ...style }}>
            {children}
        </div>
    );
}

/* ── HERO CANVAS (ambient particles) ── */
function HeroCanvas() {
    const ref = useRef(null);
    useEffect(() => {
        const canvas = ref.current;
        if (!canvas || typeof THREE === 'undefined') return;
        const W = window.innerWidth, H = canvas.parentElement.offsetHeight || 500;
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, W / H, 0.1, 1000);
        camera.position.z = 6;
        const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
        renderer.setSize(W, H);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // Ambient floating particles
        const count = 180;
        const pos = new Float32Array(count * 3);
        const vel = new Float32Array(count * 3);
        for (let i = 0; i < count; i++) {
            pos[i*3]   = (Math.random() - .5) * 20;
            pos[i*3+1] = (Math.random() - .5) * 10;
            pos[i*3+2] = (Math.random() - .5) * 8;
            vel[i*3]   = (Math.random() - .5) * 0.003;
            vel[i*3+1] = (Math.random() - .5) * 0.003;
            vel[i*3+2] = 0;
        }
        const geo = new THREE.BufferGeometry();
        const posAttr = new THREE.BufferAttribute(pos, 3);
        geo.setAttribute('position', posAttr);
        const pts = new THREE.Points(geo, new THREE.PointsMaterial({
            color: 0xc8a56a, size: 0.06, transparent: true, opacity: 0.45
        }));
        scene.add(pts);

        // Large decorative ring
        const ring = new THREE.Mesh(
            new THREE.TorusGeometry(4, 0.012, 16, 120),
            new THREE.MeshBasicMaterial({ color: 0xc8a56a, transparent: true, opacity: 0.12 })
        );
        ring.rotation.x = Math.PI / 5;
        ring.position.x = 5;
        scene.add(ring);

        const ring2 = new THREE.Mesh(
            new THREE.TorusGeometry(5.5, 0.008, 16, 120),
            new THREE.MeshBasicMaterial({ color: 0xc8a56a, transparent: true, opacity: 0.07 })
        );
        ring2.rotation.x = Math.PI / 3;
        ring2.position.x = 4;
        scene.add(ring2);

        const onResize = () => {
            const W2 = window.innerWidth;
            camera.aspect = W2 / H;
            camera.updateProjectionMatrix();
            renderer.setSize(W2, H);
        };
        window.addEventListener('resize', onResize);

        let rafId, t = 0;
        const animate = () => {
            rafId = requestAnimationFrame(animate);
            t += 0.005;
            // drift particles
            for (let i = 0; i < count; i++) {
                pos[i*3]   += vel[i*3];
                pos[i*3+1] += vel[i*3+1];
                if (Math.abs(pos[i*3]) > 10) vel[i*3] *= -1;
                if (Math.abs(pos[i*3+1]) > 5) vel[i*3+1] *= -1;
            }
            posAttr.needsUpdate = true;
            ring.rotation.z += 0.002;
            ring2.rotation.z -= 0.0015;
            renderer.render(scene, camera);
        };
        animate();
        return () => {
            cancelAnimationFrame(rafId);
            window.removeEventListener('resize', onResize);
            renderer.dispose();
        };
    }, []);
    return <canvas ref={ref} id="hero-canvas" />;
}

/* ── NAVBAR ── */
function Navbar() {
    const [scrolled, setScrolled] = useState(false);
    const [open, setOpen] = useState(false);
    useEffect(() => {
        const fn = () => setScrolled(window.scrollY > 50);

/* ── MAIN CONTENT ── */
function PriceContent() {
    const [tab, setTab] = useState(0);

    const sections = tab === 6
        ? null
        : priceData[tab];

    return (
        <>
            <PriceTabs active={tab} onChange={setTab} />
            <div className="container">
                {tab === 6
                    ? <Packages />
                    : sections && (
                        <PriceTable
                            key={tab}
                            title={sections.title}
                            subtitle={sections.subtitle}
                            badge={sections.badge}
                            rows={sections.rows}
                        />
                    )
                }
            </div>
        </>
    );
}
