<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DentArt Studio | Premium Stomatološka Ordinacija Zagreb</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        :root{
            --dark:#080c12;
            --dark2:#0d1520;
            --cream:#f8f4ee;
            --white:#ffffff;
            --gold:#c8a56a;
            --gold-l:#e8c99e;
            --gold-d:#9d7d42;
            --navy:#0d1520;
            --text:#e8e4de;
            --muted:#8a8680;
            --teal:#5ac8c0;
            --pad:clamp(60px,10vw,120px);
        }
        html{scroll-behavior:smooth}
        body{font-family:'Inter',sans-serif;background:var(--dark);color:var(--text);overflow-x:hidden;line-height:1.6}
        ::-webkit-scrollbar{width:5px}
        ::-webkit-scrollbar-track{background:var(--dark)}
        ::-webkit-scrollbar-thumb{background:var(--gold);border-radius:3px}
        h1,h2,h3{font-family:'Cormorant Garamond',serif;font-weight:400;line-height:1.05}
        .container{max-width:1200px;margin:0 auto;padding:0 clamp(20px,5vw,60px)}
        .section{padding:var(--pad) 0}
        .gold-text{background:linear-gradient(135deg,var(--gold-l),var(--gold),var(--gold-d));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}

        /* BUTTONS */
        .btn{display:inline-flex;align-items:center;gap:10px;font-family:'Inter',sans-serif;font-weight:600;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;padding:16px 36px;border:none;cursor:pointer;transition:all .3s;text-decoration:none;position:relative;overflow:hidden}
        .btn-gold{background:linear-gradient(135deg,var(--gold),var(--gold-d));color:var(--dark)}
        .btn-gold::before{content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.25),transparent);transition:left .5s}
        .btn-gold:hover::before{left:100%}
        .btn-gold:hover{transform:translateY(-2px);box-shadow:0 12px 32px rgba(200,165,106,.35)}
        .btn-outline{background:transparent;color:var(--text);border:1px solid rgba(200,165,106,.4)}
        .btn-outline:hover{border-color:var(--gold);color:var(--gold);transform:translateY(-2px)}

        /* LABEL */
        .lbl{display:flex;align-items:center;gap:12px;margin-bottom:16px}
        .lbl span{font-size:.7rem;font-weight:600;letter-spacing:.25em;text-transform:uppercase;color:var(--gold)}
        .lbl::after{content:'';flex:0 0 40px;height:1px;background:var(--gold)}

        /* NAV */
        .nav{position:fixed;top:0;left:0;right:0;z-index:1000;padding:22px 0;transition:all .4s}
        .nav.s{background:rgba(8,12,18,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid rgba(200,165,106,.08);padding:14px 0}
        .nav-inner{display:flex;align-items:center;justify-content:space-between}
        .logo{text-decoration:none;line-height:1}
        .logo-m{font-family:'Cormorant Garamond',serif;font-size:1.9rem;font-weight:600;color:#fff;letter-spacing:.05em;display:block}
        .logo-s{font-size:.58rem;letter-spacing:.35em;text-transform:uppercase;color:var(--gold);display:block}
        .nav-links{display:flex;align-items:center;gap:32px;list-style:none}
        .nav-links a{color:var(--text);text-decoration:none;font-size:.75rem;font-weight:500;letter-spacing:.1em;text-transform:uppercase;transition:color .3s;position:relative}
        .nav-links a::after{content:'';position:absolute;bottom:-4px;left:0;width:0;height:1px;background:var(--gold);transition:width .3s}
        .nav-links a:hover{color:var(--gold)}
        .nav-links a:hover::after{width:100%}
        .nav-cta{padding:9px 22px !important;border:1px solid var(--gold) !important;color:var(--gold) !important}
        .nav-cta:hover{background:var(--gold) !important;color:var(--dark) !important}
        .ham{display:none;flex-direction:column;gap:5px;background:none;border:none;cursor:pointer;padding:6px}
        .ham span{display:block;width:24px;height:1.5px;background:var(--text);transition:all .3s}
        .mob-nav{position:fixed;inset:0;background:var(--dark);z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:36px;opacity:0;pointer-events:none;transition:opacity .35s}
        .mob-nav.open{opacity:1;pointer-events:all}
        .mob-nav a{font-family:'Cormorant Garamond',serif;font-size:2.6rem;color:var(--text);text-decoration:none;transition:color .3s}
        .mob-nav a:hover{color:var(--gold)}
        .mob-close{position:absolute;top:24px;right:28px;background:none;border:none;color:#fff;font-size:2.2rem;cursor:pointer;line-height:1}

        /* HERO */
        .hero{position:relative;min-height:100vh;display:flex;align-items:center;overflow:hidden}
        #three-c{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
        .hero-grad{position:absolute;inset:0;background:radial-gradient(ellipse at 20% 50%,rgba(200,165,106,.07) 0%,transparent 55%),radial-gradient(ellipse at 75% 15%,rgba(90,200,192,.05) 0%,transparent 50%),linear-gradient(180deg,var(--dark) 0%,var(--dark2) 100%);z-index:1}
        .hero-c{position:relative;z-index:2;padding-top:90px}
        .hero-badge{display:inline-flex;align-items:center;gap:8px;background:rgba(200,165,106,.08);border:1px solid rgba(200,165,106,.18);padding:8px 18px;border-radius:100px;margin-bottom:32px}
        .hero-dot{width:6px;height:6px;border-radius:50%;background:var(--gold);animation:pulse 2s infinite}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
        .hero-badge span{font-size:.7rem;font-weight:500;letter-spacing:.12em;color:var(--gold);text-transform:uppercase}
        .hero-h1{font-size:clamp(3.2rem,8vw,7.5rem);font-weight:300;color:#fff;line-height:.92;margin-bottom:12px}
        .hero-sub{font-size:clamp(.95rem,1.8vw,1.15rem);color:var(--muted);max-width:460px;margin-bottom:48px;font-weight:300;line-height:1.85}
        .hero-acts{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
        .scroll-ind{position:absolute;bottom:36px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:2;animation:bob 3s ease-in-out infinite}
        @keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-10px)}}
        .scroll-line{width:1px;height:56px;background:linear-gradient(to bottom,var(--gold),transparent)}
        .scroll-t{font-size:.6rem;letter-spacing:.25em;text-transform:uppercase;color:var(--muted);writing-mode:vertical-lr}

        /* STATS */
        .stats{background:linear-gradient(135deg,var(--dark2),var(--dark));border-top:1px solid rgba(200,165,106,.08);border-bottom:1px solid rgba(200,165,106,.08)}
        .stats-g{display:grid;grid-template-columns:repeat(4,1fr)}
        .stat{padding:60px 36px;text-align:center;border-right:1px solid rgba(200,165,106,.08);position:relative;overflow:hidden;transition:background .4s}
        .stat:last-child{border-right:none}
        .stat:hover{background:rgba(200,165,106,.03)}
        .stat::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:0;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);transition:width .6s}
        .stat:hover::after{width:80%}
        .stat-n{font-family:'Cormorant Garamond',serif;font-size:clamp(2.5rem,5vw,4rem);font-weight:300;color:var(--gold);line-height:1;margin-bottom:8px}
        .stat-l{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}

        /* SERVICES */
        .svc-sec{background:var(--cream);color:var(--navy)}
        .svc-hdr{display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:end;margin-bottom:72px}
        .svc-h2{font-size:clamp(2.5rem,5vw,4rem);color:var(--navy)}
        .svc-p{color:#6b7280;line-height:1.85;font-size:.92rem}
        .svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
        .svc-card{background:#fff;padding:48px 38px;position:relative;overflow:hidden;cursor:default;transition:all .4s}
        .svc-card::before{content:'';position:absolute;inset:0;background:var(--navy);transform:translateY(101%);transition:transform .52s cubic-bezier(.65,0,.35,1)}
        .svc-card:hover::before{transform:translateY(0)}
        .svc-card:hover .svc-icon,.svc-card:hover .svc-nm,.svc-card:hover .svc-dsc,.svc-card:hover .svc-no{color:#fff !important}
        .svc-card:hover .svc-ln{background:var(--gold)}
        .svc-no{font-family:'Cormorant Garamond',serif;font-size:.85rem;color:var(--gold);letter-spacing:.1em;margin-bottom:28px;position:relative;z-index:1;transition:color .4s}
        .svc-icon{font-size:1.8rem;margin-bottom:16px;position:relative;z-index:1;transition:color .4s;color:var(--navy)}
        .svc-ln{width:36px;height:1px;background:var(--gold);margin:18px 0;position:relative;z-index:1;transition:background .4s}
        .svc-nm{font-family:'Cormorant Garamond',serif;font-size:1.55rem;color:var(--navy);margin-bottom:14px;position:relative;z-index:1;transition:color .4s}
        .svc-dsc{font-size:.82rem;color:#6b7280;line-height:1.85;position:relative;z-index:1;transition:color .4s}

        /* ABOUT */
        .abt{background:var(--dark);position:relative;overflow:hidden}
        .abt-grid{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:center}
        .abt-img-wrap{position:relative}
        .abt-img{width:100%;height:580px;object-fit:cover;object-position:top;display:block}
        .abt-frame{position:absolute;top:-18px;right:-18px;bottom:18px;left:18px;border:1px solid rgba(200,165,106,.25);pointer-events:none}
        .abt-tag{position:absolute;bottom:-28px;right:-28px;background:var(--gold);color:var(--dark);padding:22px 28px;z-index:2}
        .abt-tag-n{font-family:'Cormorant Garamond',serif;font-size:2.4rem;font-weight:600;line-height:1}
        .abt-tag-l{font-size:.65rem;letter-spacing:.18em;text-transform:uppercase;margin-top:4px}
        .abt-h2{font-size:clamp(2rem,4vw,3.4rem);color:#fff;margin-bottom:20px}
        .abt-txt{color:var(--muted);line-height:1.92;margin-bottom:14px;font-weight:300;font-size:.92rem}
        .divider{width:48px;height:1px;background:linear-gradient(90deg,var(--gold),transparent);margin:22px 0}
        .abt-feats{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:28px 0 36px}
        .abt-feat{display:flex;align-items:flex-start;gap:10px}
        .abt-dot{width:4px;height:4px;border-radius:50%;background:var(--gold);margin-top:8px;flex-shrink:0}
        .abt-feat span{font-size:.82rem;color:var(--text)}

        /* GALLERY */
        .gal-sec{background:var(--cream);color:var(--navy);overflow:hidden}
        .gal-h2{font-size:clamp(2.5rem,5vw,4rem);color:var(--navy);text-align:center;margin-bottom:12px}
        .gal-sub{text-align:center;color:#6b7280;margin-bottom:56px;font-size:.92rem}
        .gal-grid{display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:repeat(2,260px);gap:3px}
        .gi{overflow:hidden;position:relative;cursor:pointer}
        .gi:nth-child(1){grid-column:1/6;grid-row:1}
        .gi:nth-child(2){grid-column:6/9;grid-row:1}
        .gi:nth-child(3){grid-column:9/13;grid-row:1/3}
        .gi:nth-child(4){grid-column:1/4;grid-row:2}
        .gi:nth-child(5){grid-column:4/9;grid-row:2}
        .gi img{width:100%;height:100%;object-fit:cover;transition:transform .7s ease}
        .gi:hover img{transform:scale(1.06)}
        .gi-ov{position:absolute;inset:0;background:linear-gradient(to top,rgba(8,12,18,.65),transparent);opacity:0;transition:opacity .4s;display:flex;align-items:flex-end;padding:18px}
        .gi:hover .gi-ov{opacity:1}
        .gi-ov span{color:#fff;font-size:.72rem;letter-spacing:.12em;text-transform:uppercase}

        /* TESTIMONIALS */
        .tst-sec{background:var(--dark2)}
        .tst-hdr{text-align:center;margin-bottom:56px}
        .tst-h2{font-size:clamp(2.5rem,5vw,4rem);color:#fff}
        .tst-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
        .tst-card{background:rgba(255,255,255,.03);border:1px solid rgba(200,165,106,.1);padding:46px;transition:all .4s;position:relative;overflow:hidden}
        .tst-card::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(200,165,106,.04),transparent);opacity:0;transition:opacity .4s}
        .tst-card:hover{border-color:rgba(200,165,106,.3)}
        .tst-card:hover::before{opacity:1}
        .tst-q{font-family:'Cormorant Garamond',serif;font-size:4.5rem;color:var(--gold);line-height:.4;margin-bottom:18px;opacity:.35}
        .tst-stars{color:var(--gold);font-size:.8rem;letter-spacing:3px;margin-bottom:16px}
        .tst-txt{font-family:'Cormorant Garamond',serif;font-size:1.2rem;color:var(--text);line-height:1.75;font-style:italic;margin-bottom:28px}
        .tst-aut{display:flex;align-items:center;gap:14px}
        .tst-av{width:46px;height:46px;border-radius:50%;overflow:hidden;border:2px solid var(--gold);flex-shrink:0}
        .tst-av img{width:100%;height:100%;object-fit:cover}
        .tst-nm{font-size:.82rem;font-weight:600;color:#fff}
        .tst-rl{font-size:.7rem;color:var(--gold);letter-spacing:.08em}

        /* PRICING */
        .prc-sec{background:var(--dark)}
        .prc-hdr{text-align:center;margin-bottom:56px}
        .prc-h2{font-size:clamp(2.5rem,5vw,4rem);color:#fff}
        .prc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
        .prc-card{border:1px solid rgba(200,165,106,.1);padding:48px 38px;position:relative;transition:all .4s}
        .prc-card.feat{border-color:var(--gold);background:rgba(200,165,106,.04)}
        .prc-card:hover{border-color:rgba(200,165,106,.4);transform:translateY(-8px)}
        .prc-badge{position:absolute;top:-12px;left:50%;transform:translateX(-50%);background:var(--gold);color:var(--dark);font-size:.62rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;padding:4px 18px;white-space:nowrap}
        .prc-nm{font-size:.72rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:18px}
        .prc-pr{font-family:'Cormorant Garamond',serif;font-size:3rem;font-weight:300;color:#fff;line-height:1;margin-bottom:6px}
        .prc-pd{font-size:.78rem;color:var(--muted);margin-bottom:28px}
        .prc-feats{list-style:none;display:flex;flex-direction:column;gap:12px;margin-bottom:36px}
        .prc-feats li{display:flex;align-items:center;gap:10px;font-size:.82rem;color:var(--muted)}
        .prc-feats li::before{content:'';width:4px;height:4px;border-radius:50%;background:var(--gold);flex-shrink:0}

        /* CONTACT */
        .cnt-sec{background:var(--cream);color:var(--navy)}
        .cnt-grid{display:grid;grid-template-columns:1fr 1.2fr;gap:80px;align-items:start}
        .cnt-h2{font-size:clamp(2.5rem,5vw,4rem);color:var(--navy);margin-bottom:16px}
        .cnt-dsc{color:#6b7280;line-height:1.85;margin-bottom:36px;font-size:.92rem}
        .cnt-item{display:flex;align-items:flex-start;gap:14px;padding:18px 0;border-bottom:1px solid rgba(0,0,0,.06)}
        .cnt-ico{width:40px;height:40px;background:var(--navy);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:.95rem}
        .cnt-itxt strong{display:block;font-size:.7rem;letter-spacing:.12em;text-transform:uppercase;color:var(--navy);margin-bottom:3px}
        .cnt-itxt span{font-size:.9rem;color:#6b7280}
        .cnt-form{display:flex;flex-direction:column;gap:18px}
        .frm-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
        .fg{display:flex;flex-direction:column;gap:7px}
        .fg label{font-size:.68rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--navy)}
        .fg input,.fg select,.fg textarea{width:100%;padding:13px 15px;background:#fff;border:1px solid #e5e7eb;color:var(--navy);font-family:'Inter',sans-serif;font-size:.88rem;outline:none;transition:border-color .3s;resize:none;appearance:none;-webkit-appearance:none}
        .fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--gold)}
        .success-msg{padding:18px;background:rgba(90,200,192,.08);border:1px solid rgba(90,200,192,.25);color:var(--teal);text-align:center;font-family:'Cormorant Garamond',serif;font-size:1.1rem}

        /* CTA STRIP */
        .cta-strip{background:linear-gradient(135deg,var(--gold-d),var(--gold));padding:80px 0;text-align:center}
        .cta-strip h2{font-family:'Cormorant Garamond',serif;font-size:clamp(2rem,4vw,3.2rem);color:var(--dark);margin-bottom:8px}
        .cta-strip p{color:rgba(8,12,18,.65);font-size:.92rem;margin-bottom:32px}
        .btn-dark{background:var(--dark);color:var(--gold) !important;border:none}
        .btn-dark:hover{background:var(--dark2);transform:translateY(-2px);box-shadow:0 12px 32px rgba(0,0,0,.3)}

        /* FOOTER */
        .ftr{background:var(--dark);padding:80px 0 28px}
        .ftr-grid{display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr;gap:52px;margin-bottom:56px}
        .ftr-brand p{color:var(--muted);font-size:.82rem;line-height:1.85;margin-top:18px;max-width:260px}
        .ftr-col h4{font-size:.68rem;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);margin-bottom:22px}
        .ftr-col ul{list-style:none;display:flex;flex-direction:column;gap:11px}
        .ftr-col ul a{color:var(--muted);text-decoration:none;font-size:.82rem;transition:color .3s}
        .ftr-col ul a:hover{color:var(--gold)}
        .ftr-bot{border-top:1px solid rgba(255,255,255,.05);padding-top:28px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px}
        .ftr-bot p{color:var(--muted);font-size:.75rem}
        .ftr-soc{display:flex;gap:12px}
        .ftr-si{width:34px;height:34px;border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;color:var(--muted);text-decoration:none;font-size:.72rem;transition:all .3s;font-weight:600}
        .ftr-si:hover{border-color:var(--gold);color:var(--gold)}

        /* FADE ANIMATION */
        .fu{opacity:0;transform:translateY(36px);transition:opacity .75s ease,transform .75s ease}
        .fu.vis{opacity:1;transform:translateY(0)}

        /* FLOATING CTA */
        .float-cta{position:fixed;bottom:30px;right:30px;z-index:500;opacity:0;transform:translateY(20px);transition:all .4s;pointer-events:none}
        .float-cta.show{opacity:1;transform:translateY(0);pointer-events:all}
        .float-cta a{display:flex;align-items:center;gap:8px;background:var(--gold);color:var(--dark);font-family:'Inter',sans-serif;font-size:.72rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:14px 22px;text-decoration:none;box-shadow:0 8px 28px rgba(200,165,106,.4);transition:all .3s}
        .float-cta a:hover{transform:translateY(-3px);box-shadow:0 14px 36px rgba(200,165,106,.5)}

        /* RESPONSIVE */
        @media(max-width:1024px){
            .stats-g{grid-template-columns:repeat(2,1fr)}
            .stat:nth-child(2){border-right:none}
            .stat:nth-child(1),.stat:nth-child(2){border-bottom:1px solid rgba(200,165,106,.08)}
            .svc-hdr{grid-template-columns:1fr}
            .svc-grid{grid-template-columns:repeat(2,1fr)}
            .abt-grid{grid-template-columns:1fr}
            .abt-img-wrap{max-width:500px}
            .ftr-grid{grid-template-columns:1fr 1fr}
            .cnt-grid{grid-template-columns:1fr}
            .tst-grid{grid-template-columns:1fr 1fr}
            .prc-grid{grid-template-columns:1fr 1fr;gap:16px}
            .prc-card:nth-child(3){grid-column:span 2;max-width:50%;justify-self:center;width:100%}
        }
        @media(max-width:768px){
            .nav-links{display:none}
            .ham{display:flex}
            .svc-grid{grid-template-columns:1fr}
            .stats-g{grid-template-columns:1fr 1fr}
            .gal-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto}
            .gi{grid-column:auto !important;grid-row:auto !important;height:200px}
            .gi:nth-child(3){grid-column:span 2 !important;height:250px}
            .frm-row{grid-template-columns:1fr}
            .ftr-grid{grid-template-columns:1fr 1fr}
            .abt-feats{grid-template-columns:1fr}
            .hero-acts{flex-direction:column;align-items:flex-start}
            .tst-grid{grid-template-columns:1fr}
            .prc-grid{grid-template-columns:1fr}

<script type="text/babel">
const { useState, useEffect, useRef } = React;

/* ── THREE.JS CANVAS ── */
function HeroCanvas() {
    const ref = useRef(null);
    const mouse = useRef({ x: 0, y: 0 });

    useEffect(() => {
        const canvas = ref.current;
        if (!canvas || typeof THREE === 'undefined') return;

        const scene = new THREE.Scene();
        // Use window dimensions — canvas may have 0 size before layout
        const W = window.innerWidth, H = window.innerHeight;
        const camera = new THREE.PerspectiveCamera(60, W / H, 0.1, 1000);
        camera.position.z = 5.5;

        const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
        renderer.setSize(W, H);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

        // Lights
        scene.add(new THREE.AmbientLight(0xffffff, 0.25));
        const pl1 = new THREE.PointLight(0xc8a56a, 3, 25);
        pl1.position.set(4, 4, 4);
        scene.add(pl1);
        const pl2 = new THREE.PointLight(0x5ac8c0, 2, 20);
        pl2.position.set(-4, -3, 3);
        scene.add(pl2);
        const pl3 = new THREE.PointLight(0xffffff, 1, 15);
        pl3.position.set(0, 5, 2);
        scene.add(pl3);

        // Main torus knot
        const mainGeo = new THREE.TorusKnotGeometry(1.15, 0.32, 160, 24, 2, 3);
        const mainMat = new THREE.MeshPhongMaterial({
            color: 0xc8a56a, emissive: 0x3a2508,
            specular: 0xffeedd, shininess: 120,
            transparent: true, opacity: 0.88
        });
        const main = new THREE.Mesh(mainGeo, mainMat);
        scene.add(main);

        // Wireframe shell
        const wire = new THREE.Mesh(
            new THREE.TorusKnotGeometry(1.18, 0.33, 80, 14, 2, 3),
            new THREE.MeshBasicMaterial({ color: 0xe8c99e, wireframe: true, transparent: true, opacity: 0.07 })
        );
        scene.add(wire);

        // Orbiting rings
        const mkRing = (r, tube, color, opacity) => {
            const m = new THREE.Mesh(
                new THREE.TorusGeometry(r, tube, 16, 120),
                new THREE.MeshBasicMaterial({ color, transparent: true, opacity })
            );
            scene.add(m);
            return m;
        };
        const ring1 = mkRing(2.1, 0.012, 0xc8a56a, 0.35);
        ring1.rotation.x = Math.PI / 4;
        const ring2 = mkRing(2.6, 0.008, 0x5ac8c0, 0.18);
        ring2.rotation.x = -Math.PI / 5;
        ring2.rotation.y = Math.PI / 3;
        const ring3 = mkRing(3.1, 0.006, 0xc8a56a, 0.1);
        ring3.rotation.x = Math.PI / 7;
        ring3.rotation.z = Math.PI / 6;

        // Particles
        const pCount = 280;
        const pPos = new Float32Array(pCount * 3);
        for (let i = 0; i < pCount; i++) {
            const th = Math.random() * Math.PI * 2;
            const ph = Math.acos(2 * Math.random() - 1);
            const r = 3.2 + Math.random() * 2.4;
            pPos[i*3]   = r * Math.sin(ph) * Math.cos(th);
            pPos[i*3+1] = r * Math.sin(ph) * Math.sin(th);
            pPos[i*3+2] = r * Math.cos(ph);
        }
        const pGeo = new THREE.BufferGeometry();
        pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
        const pts = new THREE.Points(pGeo, new THREE.PointsMaterial({
            color: 0xc8a56a, size: 0.045, transparent: true, opacity: 0.55
        }));
        scene.add(pts);

        // Mouse
        const onMouse = e => {
            mouse.current.x = (e.clientX / window.innerWidth - .5) * 2;
            mouse.current.y = -(e.clientY / window.innerHeight - .5) * 2;
        };
        window.addEventListener('mousemove', onMouse);

        // Resize
        const onResize = () => {
            const W2 = window.innerWidth, H2 = window.innerHeight;
            camera.aspect = W2 / H2;
            camera.updateProjectionMatrix();
            renderer.setSize(W2, H2);
        };
        window.addEventListener('resize', onResize);

        let rafId, t = 0;
        const animate = () => {
            rafId = requestAnimationFrame(animate);
            t += 0.005;
            main.rotation.x += 0.004;
            main.rotation.y += 0.006;
            wire.rotation.x += 0.004;
            wire.rotation.y += 0.006;
            ring1.rotation.z += 0.003;
            ring2.rotation.z -= 0.0022;
            ring3.rotation.y += 0.0015;
            pts.rotation.y += 0.0008;
            pts.rotation.x += 0.0004;
            pl1.position.x = Math.sin(t) * 5;
            pl1.position.y = Math.cos(t * .7) * 4;
            scene.rotation.y += (mouse.current.x * 0.3 - scene.rotation.y) * 0.04;
            scene.rotation.x += (mouse.current.y * 0.18 - scene.rotation.x) * 0.04;
            renderer.render(scene, camera);
        };
        animate();

        return () => {
            cancelAnimationFrame(rafId);
            window.removeEventListener('mousemove', onMouse);
            window.removeEventListener('resize', onResize);
            renderer.dispose();
        };
    }, []);

    return <canvas ref={ref} id="three-c" />;
}

/* ── FADE UP WRAPPER ── */
function FU({ children, delay = 0, style = {} }) {
    const ref = useRef(null);
    const [vis, setVis] = useState(false);
    useEffect(() => {
        const obs = new IntersectionObserver(([e]) => {
            if (e.isIntersecting) { setVis(true); obs.disconnect(); }
        }, { threshold: 0.1 });
        if (ref.current) obs.observe(ref.current);
        return () => obs.disconnect();
    }, []);
    return (
        <div ref={ref} className={`fu${vis?' vis':''}`} style={{ transitionDelay: `${delay}s`, ...style }}>
            {children}
        </div>
    );
}

/* ── COUNTER ── */
function Counter({ to, suffix = '' }) {
    const [n, setN] = useState(0);
    const ref = useRef(null);
    const done = useRef(false);
    useEffect(() => {
        const obs = new IntersectionObserver(([e]) => {
            if (e.isIntersecting && !done.current) {
                done.current = true;
                let cur = 0;
                const step = to / (2000 / 16);
                const id = setInterval(() => {
                    cur += step;
                    if (cur >= to) { setN(to); clearInterval(id); }
                    else setN(Math.floor(cur));
                }, 16);
            }
        }, { threshold: 0.5 });
        if (ref.current) obs.observe(ref.current);
        return () => obs.disconnect();
    }, [to]);
    return <span ref={ref}>{n}{suffix}</span>;
}

function Contact() {
    const [form, setForm] = useState({name:'',email:'',phone:'',svc:'',msg:'',date:''});
    const [sent, setSent] = useState(false);
    const upd = k => e => setForm({...form,[k]:e.target.value});
    const sub = e => { e.preventDefault(); setSent(true); setTimeout(()=>setSent(false),4500); };
    const info = [
        ['📍','Adresa','Ilica 45, 10000 Zagreb'],
        ['📞','Telefon','+385 1 234 5678'],
        ['✉','Email','info@dentart.hr'],
        ['🕐','Radno vrijeme','Pon–Sub: 8:00 – 20:00'],
    ];
    return (
        <section className="cnt-sec section" id="kontakt">
            <div className="container">
                <div className="cnt-grid">
                    <div>
                        <FU><div className="lbl"><span>Kontakt</span></div></FU>
                        <FU delay={0.1}><h2 className="cnt-h2">Zakaži termin<br/><em>već danas</em></h2></FU>
                        <FU delay={0.18}><p className="cnt-dsc">Napravite prvi korak prema savršenom osmijehu. Naš tim odgovara unutar 24 sata.</p></FU>
                        <FU delay={0.26}>
                            {info.map(([ico,lbl,val],i)=>(
                                <div className="cnt-item" key={i}>
                                    <div className="cnt-ico">{ico}</div>
                                    <div className="cnt-itxt">
                                        <strong>{lbl}</strong>
                                        <span>{val}</span>
                                    </div>
                                </div>
                            ))}
                        </FU>
                    </div>
                    <FU delay={0.18}>
                        <form className="cnt-form" onSubmit={sub}>
                            <div className="frm-row">
                                <div className="fg">
                                    <label>Ime i prezime</label>
                                    <input type="text" placeholder="Ivan Horvat" required value={form.name} onChange={upd('name')} />
                                </div>
                                <div className="fg">
                                    <label>Email adresa</label>
                                    <input type="email" placeholder="ivan@email.com" required value={form.email} onChange={upd('email')} />
                                </div>
                            </div>
                            <div className="frm-row">
                                <div className="fg">
                                    <label>Telefon</label>
                                    <input type="tel" placeholder="+385 91 234 5678" value={form.phone} onChange={upd('phone')} />
                                </div>
                                <div className="fg">
                                    <label>Željeni termin</label>
                                    <input type="date" value={form.date} onChange={upd('date')} />
                                </div>
                            </div>
                            <div className="fg">
                                <label>Usluga</label>
                                <select value={form.svc} onChange={upd('svc')}>
                                    <option value="">Odaberite uslugu...</option>
                                    <option>Estetska stomatologija</option>
                                    <option>Implantati</option>
                                    <option>Ortodoncija</option>
                                    <option>Bijeljenje zuba</option>
                                    <option>Parodontologija</option>
                                    <option>Dječja stomatologija</option>
                                    <option>Konzultacija</option>
                                </select>
                            </div>
                            <div className="fg">
                                <label>Poruka (opcionalno)</label>
                                <textarea placeholder="Opišite vaše potrebe ili pitanja..." rows="4" value={form.msg} onChange={upd('msg')} />
                            </div>
                            {sent
                                ? <div className="success-msg">✓ Hvala! Kontaktirat ćemo vas uskoro.</div>
                                : <button type="submit" className="btn btn-gold" style={{width:'100%',justifyContent:'center'}}>Pošalji zahtjev →</button>
                            }
                        </form>
                    </FU>
                </div>
            </div>
        </section>
    );
}

                    <div className="ftr-brand">

                            <span className="logo-m">DentArt</span>
                            <span className="logo-s">Premium Studio</span>
                        </a>
                        <p>Vaša stomatološka ordinacija u srcu Zagreba. Posvećeni izvrsnosti u svakom osmijehu koji stvaramo zajedno s vama.</p>
                    </div>
                    <div className="ftr-col">
                        <h4>Usluge</h4>
                        <ul>{['Estetska stomatologija','Implantati','Ortodoncija','Bijeljenje zuba','Parodontologija'].map((s,i)=><li key={i}><a href="#usluge">{s}</a></li>)}</ul>
                    </div>
                    <div className="ftr-col">
                        <h4>Ordinacija</h4>
                        <ul>{['O nama','Naš tim','Galerija','Recenzije','Cjenik'].map((s,i)=><li key={i}><a href="#">{s}</a></li>)}</ul>
                    </div>
                    <div className="ftr-col">
                        <h4>Kontakt</h4>
                        <ul>
                            <li><a href="#">Ilica 45, Zagreb</a></li>
                            <li><a href="tel:+38512345678">+385 1 234 5678</a></li>
                            <li><a href="mailto:info@dentart.hr">info@dentart.hr</a></li>
                            <li><a href="#">Pon–Sub 8–20h</a></li>
                        </ul>
                    </div>
                </div>
                <div className="ftr-bot">
                    <p>© 2024 DentArt Studio. Sva prava pridržana.</p>
                    <div className="ftr-soc">
                        {[['f','#'],['in','#'],['ig','#'],['yt','#']].map(([l,h],i)=>(
                            <a key={i} href={h} className="ftr-si">{l}</a>
                        ))}
                    </div>
                </div>
            </div>
        </footer>
    );
}

    return (
        <>
            <FloatCTA />
            <Navbar />

            <Gallery />
            <Testimonials />

</script>
</body>
